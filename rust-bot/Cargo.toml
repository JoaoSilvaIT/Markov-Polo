[package]
name = "trading-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.37.0", features = ["full"] }

# HTTP & API
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
hmac = "0.12.1"
sha2 = "0.10.8"
hex = "0.4.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Math & Linear Algebra
ndarray = "0.15.6"
ndarray-stats = "0.5.1"
statrs = "0.16.1"

# Technical Indicators
ta = "0.5.0"

# GCP Auth
gcp_auth = "0.12.7"


# Time
chrono = { version = "0.4.38", features = ["serde"] }

# Environment
dotenvy = "0.15.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
