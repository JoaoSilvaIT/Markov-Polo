services:
  hl_bot_btc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hl_bot_btc
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HL_TRADING_SYMBOL=BTC
      - HL_LEVERAGE=${HL_LEVERAGE:-3}
      - HL_IS_CROSS=${HL_IS_CROSS:-true}
    volumes:
      - ./hl_bot_data:/app

  hl_bot_eth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hl_bot_eth
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HL_TRADING_SYMBOL=ETH
      - HL_LEVERAGE=${HL_LEVERAGE:-3}
      - HL_IS_CROSS=${HL_IS_CROSS:-true}
    volumes:
      - ./hl_bot_data:/app

  hl_bot_sol:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hl_bot_sol
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HL_TRADING_SYMBOL=SOL
      - HL_LEVERAGE=${HL_LEVERAGE:-3}
      - HL_IS_CROSS=${HL_IS_CROSS:-true}
    volumes:
      - ./hl_bot_data:/app
