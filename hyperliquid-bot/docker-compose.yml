services:
  hl_bot_btc:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hl_bot_btc
    restart: unless-stopped
    environment:
      - HL_PRIVATE_KEY=${HL_PRIVATE_KEY}
      - HL_WALLET_ADDRESS=${HL_WALLET_ADDRESS}
      - HL_IS_MAINNET=${HL_IS_MAINNET:-true}
      - HL_TRADING_SYMBOL=BTC
      - POSITION_SIZE_USDC=${POSITION_SIZE_USDC:-25.0}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    volumes:
      - ./data:/app/data

  hl_bot_eth:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hl_bot_eth
    restart: unless-stopped
    environment:
      - HL_PRIVATE_KEY=${HL_PRIVATE_KEY}
      - HL_WALLET_ADDRESS=${HL_WALLET_ADDRESS}
      - HL_IS_MAINNET=${HL_IS_MAINNET:-true}
      - HL_TRADING_SYMBOL=ETH
      - POSITION_SIZE_USDC=${POSITION_SIZE_USDC:-25.0}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    volumes:
      - ./data:/app/data

  hl_bot_sol:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hl_bot_sol
    restart: unless-stopped
    environment:
      - HL_PRIVATE_KEY=${HL_PRIVATE_KEY}
      - HL_WALLET_ADDRESS=${HL_WALLET_ADDRESS}
      - HL_IS_MAINNET=${HL_IS_MAINNET:-true}
      - HL_TRADING_SYMBOL=SOL
      - POSITION_SIZE_USDC=${POSITION_SIZE_USDC:-25.0}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    volumes:
      - ./data:/app/data
