[package]
name = "hyperliquid-bot"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.37.0", features = ["full"] }
tokio-tungstenite = { version = "0.21.0", features = ["rustls-tls-native-roots"] }
futures-util = "0.3.30"

# Hyperliquid SDK
hyperliquid_rust_sdk = "0.6.0"

# HTTP & API
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Math & Linear Algebra
ndarray = "0.15.6"
statrs = "0.16.1"

# Time & Utilities
chrono = { version = "0.4.38", features = ["serde"] }
dotenvy = "0.15.7"
libc = "0.2"
uuid = { version = "1.7", features = ["v4", "serde"] }

# Ethers
ethers = { version = "2.0", default-features = false, features = ["rustls"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
