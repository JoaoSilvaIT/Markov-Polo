services:
  dashboard:
    build: .
    container_name: binance_quant_dashboard
    restart: unless-stopped
    command:
    - streamlit
    - run
    - dashboard.py
    - --server.port=8501
    - --server.address=0.0.0.0
    ports:
    - 8501:8501
    volumes: []
  hmm_bot_btc:
    build: ./rust-bot
    container_name: hmm_bot_btc
    restart: unless-stopped
    command:
    - trading-bot
    env_file:
    - .env
    environment:
    - TRADING_SYMBOL=BTCUSDC
    volumes:
    - ./rust-bot_data:/app
  hmm_bot_eth:
    build: ./rust-bot
    container_name: hmm_bot_eth
    restart: unless-stopped
    command:
    - trading-bot
    env_file:
    - .env
    environment:
    - TRADING_SYMBOL=ETHUSDC
    volumes:
    - ./rust-bot_data:/app
  hmm_bot_sol:
    build: ./rust-bot
    container_name: hmm_bot_sol
    restart: unless-stopped
    command:
    - trading-bot
    env_file:
    - .env
    environment:
    - TRADING_SYMBOL=SOLUSDC
    volumes:
    - ./rust-bot_data:/app
